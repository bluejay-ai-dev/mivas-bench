# Child buildspec for one harness×industry image (amd64).
# Batch list is generated by run.py --codebuild and prepended at zip time.
version: 0.2

env:
  variables:
    PLATFORM: linux/amd64

phases:
  pre_build:
    commands:
      - |
        set -euo pipefail
        : "${HARNESS:?HARNESS is required (family/runtime)}"
        : "${INDUSTRY:?INDUSTRY is required}"
        : "${MIVAS_IMAGE_PREFIX:?MIVAS_IMAGE_PREFIX is required}"
        REGION="${AWS_DEFAULT_REGION:-us-west-1}"
        aws ecr get-login-password --region "${REGION}" \
          | docker login --username AWS --password-stdin "${MIVAS_IMAGE_PREFIX%/*}"
        docker buildx create --name mivas --driver docker-container --use >/dev/null 2>&1 || docker buildx use mivas
  build:
    commands:
      - |
        set -euo pipefail
        FAMILY="${HARNESS%%/*}"
        RUNTIME="${HARNESS#*/}"
        DOCKERFILE="voice-agent-harnesses/${FAMILY}/${RUNTIME}/Dockerfile"
        test -f "${DOCKERFILE}"
        SLUG="$(echo "${HARNESS}-${INDUSTRY}" | tr '/_.' '-' | tr '[:upper:]' '[:lower:]')"
        IMAGE="${MIVAS_IMAGE_PREFIX}:${SLUG}"
        CACHE="${MIVAS_IMAGE_PREFIX}:cache-${FAMILY}"
        echo "building ${IMAGE} platform=${PLATFORM} cache=${CACHE}"
        docker buildx build \
          --builder mivas \
          --platform "${PLATFORM}" \
          -f "${DOCKERFILE}" \
          --build-arg "INDUSTRY=${INDUSTRY}" \
          --cache-from "type=registry,ref=${CACHE}" \
          --cache-to "type=registry,ref=${CACHE},mode=max" \
          -t "${IMAGE}" \
          --push \
          .
        echo "pushed ${IMAGE}"
