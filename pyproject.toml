[project]
name = "mivas-bench"
version = "0.1.0"
description = "Multi-Industry Voice Agent Simulation Bench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # control-industry state API
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    # openai harness + voice converse
    "openai-agents>=0.18.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "sounddevice>=0.5.0",
    "websockets>=14.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    # gemini harness
    "google-genai>=1.0.0",
]
[dependency-groups]
dev = []

[tool.uv]
package = false

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
extraPaths = ["voice-agent-harnesses/openai", "voice-agent-harnesses/gemini"]
