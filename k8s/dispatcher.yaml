# Daily pinless SIP webhook. One per cluster; forwards to pipecat-* workers.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mivas-pipecat-dispatcher
  labels:
    app: mivas-bench
    mivas.component: pipecat-dispatcher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mivas-bench
      mivas.component: pipecat-dispatcher
  template:
    metadata:
      labels:
        app: mivas-bench
        mivas.component: pipecat-dispatcher
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: mivas-bench
      containers:
        - name: dispatcher
          image: __IMAGE__
          imagePullPolicy: __IMAGE_PULL_POLICY__
          env:
            - name: MIVAS_MODE
              value: "dispatcher"
            - name: HARNESS
              value: "pipecat/cascaded"
            - name: INDUSTRY
              value: "__INDUSTRY__"
            - name: HARNESS_FAMILY
              value: "pipecat"
            - name: HARNESS_RUNTIME
              value: "cascaded"
            - name: HARNESS_FAMILY_DIR
              value: "/app/harness"
            - name: HARNESS_DIR
              value: "/app/harness/cascaded"
            - name: PYTHONPATH
              value: "/app/runtime:/app/harness"
            - name: MIVAS_BASE_DOMAIN
              value: "__BASE_DOMAIN__"
            - name: PIPECAT_WORKER_URL_TEMPLATE
              value: "__WORKER_URL_TEMPLATE__"
            - name: PIPECAT_DISPATCHER_PORT
              value: "8000"
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mivas-pipecat-dispatcher
  labels:
    app: mivas-bench
    mivas.component: pipecat-dispatcher
spec:
  type: ClusterIP
  selector:
    app: mivas-bench
    mivas.component: pipecat-dispatcher
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mivas-pipecat-dispatcher
  labels:
    app: mivas-bench
    mivas.component: pipecat-dispatcher
  annotations:
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: "8000"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/target-group-attributes: load_balancing.algorithm.type=least_outstanding_requests
spec:
  ingressClassName: mivas-alb
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /dialin
            pathType: Prefix
            backend:
              service:
                name: mivas-pipecat-dispatcher
                port:
                  name: http
