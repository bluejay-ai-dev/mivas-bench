# Example secret for MIVAS Deployments. Do not commit real keys.
# Create / refresh via `uv run python run.py --apply` (syncs keys present in .env),
# or apply after replacing placeholders:
#
#   kubectl apply -f k8s/secret.example.yaml
#
# Only the keys needed by the harnesses you run must be set; others may stay empty.
apiVersion: v1
kind: Secret
metadata:
  name: mivas-secrets
  labels:
    app: mivas-bench
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  NVIDIA_API_KEY: ""
  NGC_API_KEY: ""
  VAPI_API_KEY: ""
  RETELL_API_KEY: ""
  BLAND_API_KEY: ""
  CARTESIA_API_KEY: ""
  ELEVENLABS_API_KEY: ""
  ASSEMBLYAI_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  GOOGLE_API_KEY: ""
  GROK_API_KEY: ""
  XAI_API_KEY: ""
  DASHSCOPE_API_KEY: ""
  QWEN_API_KEY: ""
  QWEN_WS_URL: ""
  QWEN_WORKSPACE_ID: ""
  QWEN_REGION: "us-east-1"
  DAILY_API_KEY: ""
  LIVEKIT_URL: ""
  LIVEKIT_API_KEY: ""
  LIVEKIT_API_SECRET: ""
  VOICECHAT_WS_URL: ""
  VOICECHAT_FUNCTION_ID: ""
  BLUEJAY_API_KEY: ""
  PUBLIC_URL: ""
  CHIRP_USER: "mivas"
  CHIRP_PASS: "mivas"
