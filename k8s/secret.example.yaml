# Example secret for MIVAS Jobs. Do not commit real keys.
# Create with:
#   kubectl create secret generic mivas-secrets \
#     --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY"
#
# Or apply after replacing the placeholder:
apiVersion: v1
kind: Secret
metadata:
  name: mivas-secrets
  labels:
    app: mivas-bench
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-me"
