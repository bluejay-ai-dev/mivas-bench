# Example secret for MIVAS Deployments. Do not commit real keys.
# Create with:
#   kubectl create secret generic mivas-secrets \
#     --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
#     --from-literal=BLUEJAY_API_KEY="$BLUEJAY_API_KEY" \
#     --from-literal=CHIRP_USER=mivas \
#     --from-literal=CHIRP_PASS=mivas
#
# Or apply after replacing the placeholders:
apiVersion: v1
kind: Secret
metadata:
  name: mivas-secrets
  labels:
    app: mivas-bench
type: Opaque
stringData:
  OPENAI_API_KEY: "replace-me"
  BLUEJAY_API_KEY: "replace-me"
  CHIRP_USER: "mivas"
  CHIRP_PASS: "mivas"
