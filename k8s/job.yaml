# One-shot Job (agent --check / agent mode). Bluejay CHIRP uses Deployment+Service via
# `uv run python run.py --build --apply` (see k8s/deployment.yaml + service.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: mivas-__SLUG__-check
  labels:
    app: mivas-bench
    mivas.harness_family: "__HARNESS_FAMILY__"
    mivas.harness_runtime: "__HARNESS_RUNTIME__"
    mivas.industry: "__INDUSTRY__"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: mivas-bench
        mivas.harness_family: "__HARNESS_FAMILY__"
        mivas.harness_runtime: "__HARNESS_RUNTIME__"
        mivas.industry: "__INDUSTRY__"
    spec:
      restartPolicy: Never
      dnsPolicy: ClusterFirst
      containers:
        - name: mivas
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: MIVAS_MODE
              value: "check"
            - name: HARNESS
              value: "__HARNESS__"
            - name: INDUSTRY
              value: "__INDUSTRY__"
            - name: HARNESS_FAMILY
              value: "__HARNESS_FAMILY__"
            - name: HARNESS_RUNTIME
              value: "__HARNESS_RUNTIME__"
            - name: HARNESS_DIR
              value: "/app/harness/__HARNESS_RUNTIME__"
            - name: PYTHONPATH
              value: "/app/harness"
            - name: TOOL_SERVER_URL
              value: "http://127.0.0.1:8000"
            - name: TOOL_SERVER_PORT
              value: "8000"
            - name: MIVAS_DB_PATH
              value: "/data/industry.db"
            - name: INDUSTRY_DIR
              value: "/app/industry"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: OPENAI_API_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
