# One FastAPI + SQLite writer per harness×industry pair.
# Scale independently of the CHIRP Deployment (v1: always 1 replica).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mivas-__SLUG__-tools
  labels:
    app: mivas-bench
    mivas.component: tools
    mivas.slug: "__SLUG__-tools"
    mivas.harness_family: "__HARNESS_FAMILY__"
    mivas.harness_runtime: "__HARNESS_RUNTIME__"
    mivas.industry: "__INDUSTRY__"
spec:
  replicas: __TOOLS_REPLICAS__
  selector:
    matchLabels:
      app: mivas-bench
      mivas.slug: "__SLUG__-tools"
  template:
    metadata:
      labels:
        app: mivas-bench
        mivas.component: tools
        mivas.slug: "__SLUG__-tools"
        mivas.harness_family: "__HARNESS_FAMILY__"
        mivas.harness_runtime: "__HARNESS_RUNTIME__"
        mivas.industry: "__INDUSTRY__"
    spec:
      containers:
        - name: tools
          image: __IMAGE__
          imagePullPolicy: __IMAGE_PULL_POLICY__
          env:
            - name: MIVAS_ROLE
              value: "tools"
            - name: MIVAS_MODE
              value: "__MIVAS_MODE__"
            - name: HARNESS
              value: "__HARNESS__"
            - name: INDUSTRY
              value: "__INDUSTRY__"
            - name: HARNESS_FAMILY
              value: "__HARNESS_FAMILY__"
            - name: HARNESS_RUNTIME
              value: "__HARNESS_RUNTIME__"
            - name: HARNESS_DIR
              value: "/app/harness/__HARNESS_RUNTIME__"
            - name: PYTHONPATH
              value: "/app/runtime:/app/harness"
            - name: TOOL_SERVER_PORT
              value: "8000"
            - name: TOOL_SERVER_URL
              value: "http://127.0.0.1:8000"
            - name: MIVAS_DB_PATH
              value: "/data/industry.db"
            - name: INDUSTRY_DIR
              value: "/app/industry"
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - containerPort: 8000
              name: tools
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: tools
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
