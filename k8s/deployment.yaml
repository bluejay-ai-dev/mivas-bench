apiVersion: apps/v1
kind: Deployment
metadata:
  name: mivas-__SLUG__
  labels:
    app: mivas-bench
    mivas.harness_family: "__HARNESS_FAMILY__"
    mivas.harness_runtime: "__HARNESS_RUNTIME__"
    mivas.industry: "__INDUSTRY__"
spec:
  replicas: __REPLICAS__
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # In-flight WebSockets die if their pod is deleted. Scale by adding
      # replicas; do not cycle pods mid-run. maxUnavailable: 0 keeps the old
      # replica until the surge pod is Ready.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mivas-bench
      mivas.slug: "__SLUG__"
  template:
    metadata:
      annotations:
        # Karpenter consolidation evicted a pod mid-run ("Evicted pod:
        # Underutilized"), dropping six live calls and the trace POST in the
        # harness's finally block. maxUnavailable above only guards rollouts.
        karpenter.sh/do-not-disrupt: "true"
      labels:
        app: mivas-bench
        mivas.slug: "__SLUG__"
        mivas.harness_family: "__HARNESS_FAMILY__"
        mivas.harness_runtime: "__HARNESS_RUNTIME__"
        mivas.industry: "__INDUSTRY__"
    spec:
      # EKS Pod Identity: grants s3:PutObject on the snapshot bucket. Node IMDS
      # runs at hop limit 1, so the instance profile is unreachable from a pod.
      serviceAccountName: mivas-bench
      containers:
        - name: mivas
          image: __IMAGE__
          imagePullPolicy: __IMAGE_PULL_POLICY__
          env:
            - name: MIVAS_MODE
              value: "__MIVAS_MODE__"
            - name: HARNESS
              value: "__HARNESS__"
            - name: INDUSTRY
              value: "__INDUSTRY__"
            - name: HARNESS_FAMILY
              value: "__HARNESS_FAMILY__"
            - name: HARNESS_RUNTIME
              value: "__HARNESS_RUNTIME__"
            - name: HARNESS_FAMILY_DIR
              value: "/app/harness"
            - name: HARNESS_DIR
              value: "/app/harness/__HARNESS_RUNTIME__"
            - name: PYTHONPATH
              value: "/app/runtime:/app/harness"
            - name: TOOL_SERVER_URL
              value: "http://127.0.0.1:8000"
            - name: TOOL_SERVER_PORT
              value: "8000"
            - name: CHIRP_PORT
              value: "8765"
            - name: MIVAS_DB_PATH
              value: "/data/industry.db"
            - name: MIVAS_SLUG
              value: "__SLUG__"
            - name: MIVAS_SNAPSHOT_BUCKET
              value: "__SNAPSHOT_BUCKET__"
            - name: MIVAS_SNAPSHOT_PREFIX
              value: "__SNAPSHOT_PREFIX__"
            - name: AWS_DEFAULT_REGION
              value: "__AWS_REGION__"
            - name: INDUSTRY_DIR
              value: "/app/industry"
            - name: PUBLIC_URL
              value: "__PUBLIC_URL__"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: NVIDIA_API_KEY
                  optional: true
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: NGC_API_KEY
                  optional: true
            - name: NEMOTRON_LLM_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: NEMOTRON_LLM_BASE_URL
                  optional: true
            - name: NEMOTRON_LLM_MODEL
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: NEMOTRON_LLM_MODEL
                  optional: true
            - name: NEMOTRON_ASR_SERVER
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: NEMOTRON_ASR_SERVER
                  optional: true
            - name: NEMOTRON_TTS_SERVER
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: NEMOTRON_TTS_SERVER
                  optional: true
            - name: NEMOTRON_USE_SSL
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: NEMOTRON_USE_SSL
                  optional: true
            - name: NEMOTRON_ASR_FUNCTION_ID
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: NEMOTRON_ASR_FUNCTION_ID
                  optional: true
            - name: VAPI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: VAPI_API_KEY
                  optional: true
            - name: RETELL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: RETELL_API_KEY
                  optional: true
            - name: BLAND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: BLAND_API_KEY
                  optional: true
            - name: CARTESIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: CARTESIA_API_KEY
                  optional: true
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: ELEVENLABS_API_KEY
                  optional: true
            - name: ELEVEN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: ELEVENLABS_API_KEY
                  optional: true
            - name: ASSEMBLYAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: ASSEMBLYAI_API_KEY
                  optional: true
            - name: ASSEMBLYAI_VOICE
              value: "alba"
            - name: TWILIO_WELCOME_GREETING
              value: "__TWILIO_WELCOME_GREETING__"
            - name: DEEPGRAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: DEEPGRAM_API_KEY
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: GOOGLE_API_KEY
                  optional: true
            - name: GROK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: GROK_API_KEY
                  optional: true
            - name: XAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: XAI_API_KEY
                  optional: true
            - name: LIVEKIT_URL
              valueFrom:
                secretKeyRef:
                  name: __LIVEKIT_SECRET_NAME__
                  key: LIVEKIT_URL
                  optional: true
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: __LIVEKIT_SECRET_NAME__
                  key: LIVEKIT_API_KEY
                  optional: true
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: __LIVEKIT_SECRET_NAME__
                  key: LIVEKIT_API_SECRET
                  optional: true
            - name: VOICECHAT_WS_URL
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: VOICECHAT_WS_URL
                  optional: true
            - name: VOICECHAT_FUNCTION_ID
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: VOICECHAT_FUNCTION_ID
                  optional: true
            - name: BLUEJAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: BLUEJAY_API_KEY
                  optional: true
            - name: DAILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: DAILY_API_KEY
                  optional: true
            - name: BLUEJAY_API_URL
              value: "__BLUEJAY_API_URL__"
            - name: BLUEJAY_OTLP_ENDPOINT
              value: "__BLUEJAY_OTLP_ENDPOINT__"
            - name: BLUEJAY_SERVICE_NAME
              value: "mivas-__HARNESS_FAMILY__"
            - name: CHIRP_USER
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: CHIRP_USER
                  optional: true
            - name: CHIRP_PASS
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: CHIRP_PASS
                  optional: true
            - name: PYTHONUNBUFFERED
              value: "1"
          ports:
            - containerPort: 8000
              name: tools
            - containerPort: 8765
              name: chirp
          resources:
            requests:
              cpu: __CPU_REQUEST__
              memory: __MEMORY_REQUEST__
            limits:
              memory: __MEMORY_LIMIT__
          readinessProbe:
            # In-pod industry tool server on :8000. Do not TCP-probe :8765.
            httpGet:
              path: /health
              port: tools
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
