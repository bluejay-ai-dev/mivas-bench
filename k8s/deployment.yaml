apiVersion: apps/v1
kind: Deployment
metadata:
  name: mivas-__JOB_SLUG__
  labels:
    app: mivas-bench
    mivas.harness: "__HARNESS_FAMILY__"
    mivas.runtime: "__HARNESS_RUNTIME__"
    mivas.industry: "__INDUSTRY__"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mivas-bench
      mivas.slug: "__JOB_SLUG__"
  template:
    metadata:
      labels:
        app: mivas-bench
        mivas.slug: "__JOB_SLUG__"
        mivas.harness: "__HARNESS_FAMILY__"
        mivas.runtime: "__HARNESS_RUNTIME__"
        mivas.industry: "__INDUSTRY__"
    spec:
      containers:
        - name: mivas
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: MIVAS_MODE
              value: "chirp"
            - name: VOICE_AGENT
              value: "__VOICE_AGENT__"
            - name: INDUSTRY
              value: "__INDUSTRY__"
            - name: HARNESS_RUNTIME
              value: "__HARNESS_RUNTIME__"
            - name: HARNESS_DIR
              value: "/app/harness/__HARNESS_RUNTIME__"
            - name: PYTHONPATH
              value: "/app/harness"
            - name: TOOL_SERVER_URL
              value: "http://127.0.0.1:8000"
            - name: TOOL_SERVER_PORT
              value: "8000"
            - name: CHIRP_PORT
              value: "8765"
            - name: MIVAS_DB_PATH
              value: "/data/industry.db"
            - name: INDUSTRY_DIR
              value: "/app/industry"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: OPENAI_API_KEY
                  optional: true
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: NVIDIA_API_KEY
                  optional: true
            - name: BLUEJAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: BLUEJAY_API_KEY
                  optional: true
            - name: BLUEJAY_SERVICE_NAME
              value: "mivas-__HARNESS_FAMILY__"
            - name: CHIRP_USER
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: CHIRP_USER
                  optional: true
            - name: CHIRP_PASS
              valueFrom:
                secretKeyRef:
                  name: mivas-secrets
                  key: CHIRP_PASS
                  optional: true
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /data
          ports:
            - containerPort: 8000
              name: tools
            - containerPort: 8765
              name: chirp
          readinessProbe:
            # Probe the tool server — TCP probes on the CHIRP port spam
            # websockets with "opening handshake failed" stack traces.
            httpGet:
              path: /health
              port: tools
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
