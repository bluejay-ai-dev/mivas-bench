# Tools-only public hostname for worker families (Pipecat Cloud / LiveKit).
# Combined pod: the industry FastAPI still listens on :8000 in the same container.
# One Prefix `/tools` — extra FastAPI routes must live under /tools so they
# do not cost another ALB rule. Evals still read S3, not this host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mivas-__SLUG__
  labels:
    app: mivas-bench
    mivas.component: tools
    mivas.harness_family: "__HARNESS_FAMILY__"
    mivas.harness_runtime: "__HARNESS_RUNTIME__"
    mivas.industry: "__INDUSTRY__"
    mivas.slug: "__SLUG__"
  annotations:
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: "8000"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: mivas-alb
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /tools
            pathType: Prefix
            backend:
              service:
                name: mivas-__SLUG__
                port:
                  name: tools
