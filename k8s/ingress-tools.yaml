# Tools-only public hostname for worker families (Pipecat Cloud / LiveKit).
# They do not serve Bluejay CHIRP; the bot POSTs https://__HOST__/tools/{name}.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mivas-__SLUG__
  labels:
    app: mivas-bench
    mivas.component: tools
    mivas.harness_family: "__HARNESS_FAMILY__"
    mivas.harness_runtime: "__HARNESS_RUNTIME__"
    mivas.industry: "__INDUSTRY__"
    mivas.slug: "__SLUG__"
  annotations:
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: "8000"
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/success-codes: "200"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: mivas-alb
  rules:
    - host: __HOST__
      http:
        paths:
          - path: /tools
            pathType: Prefix
            backend:
              service:
                name: mivas-__SLUG__-tools
                port:
                  name: tools
          - path: /state
            pathType: Prefix
            backend:
              service:
                name: mivas-__SLUG__-tools
                port:
                  name: tools
          - path: /snapshot
            pathType: Prefix
            backend:
              service:
                name: mivas-__SLUG__-tools
                port:
                  name: tools
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: mivas-__SLUG__-tools
                port:
                  name: tools
